name: ibuyfree.com health check

# 每 30 分钟对生产站跑一次"健康三件套"，失败就让这次运行本身标红失败。
# 002-upgrade-notionnext T30。脚本见 scripts/ibuyfree-health-check.sh
# （跟仓库自带的 scripts/health-check.js 是两回事，那个是本地构建检查）。
#
# 这个文件本身放在 main 分支（GitHub 定时触发器只认默认分支），
# 但实际检查逻辑固定从 feat/upgrade-4.10（生产分支）取，main 上
# 只有这一个文件，不掺和生产代码。
#
# 报警方式：这个仓库把 Issues 功能关掉了，所以没法靠开 issue 报警。
# 改用 GitHub 对失败的 scheduled workflow 自带的邮件通知（发给仓库
# 的 watchers/actor，默认开启，不需要额外配置）——失败时这一步直接
# exit 非零，让整个 job 标红失败即可触发。

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/upgrade-4.10

      - name: Run health check against production
        run: |
          chmod +x scripts/ibuyfree-health-check.sh
          scripts/ibuyfree-health-check.sh https://www.ibuyfree.com
